<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Member Management System</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; line-height: 1.6; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"] { width: 300px; padding: 8px; box-sizing: border-box; }
    button { padding: 8px 16px; margin-right: 10px; cursor: pointer; }
    .btn-secondary { background-color: #6c757d; color: white; border: none; }
    .btn-primary { background-color: #007bff; color: white; border: none; }
  </style>
</head>
<body>

  <h2>Member Management</h2>

  <div class="form-group">
    <label for="txtMemberId">Member ID:</label>
    <input type="text" id="txtMemberId" placeholder="e.g. M-001">
    <button id="btnNewId" class="btn-secondary">New ID</button>
  </div>

  <div class="form-group">
    <label for="txtMemberName">Member Name:</label>
    <input type="text" id="txtMemberName" placeholder="Enter Full Name">
  </div>

  <button id="btnSaveMember" class="btn-primary">Save Member</button>

  <script>
    // --- SIMULATED DATABASE STATE (Replace with actual Firebase/API calls) ---
    let dbMembers = [
      { id: "M-001", name: "Alice Johnson" },
      { id: "M-002", name: "Bob Smith" },
      { id: "M-003", name: "Charlie Davis" }
    ];

    // DOM Elements
    const txtMemberId = document.getElementById('txtMemberId');
    const txtMemberName = document.getElementById('txtMemberName');
    const btnNewId = document.getElementById('btnNewId');
    const btnSaveMember = document.getElementById('btnSaveMember');

    // --- HELPER FUNCTIONS ---

    // Fetch members list (Async wrapper for Firebase/API calls)
    async function getMembersFromDatabase() {
      // Return local array clone; replace with `await getDocs(...)` for Firestore
      return [...dbMembers];
    }

    // Save member (Async wrapper for Firebase/API calls)
    async function saveMemberToDatabase(memberData) {
      const existingIndex = dbMembers.findIndex(m => m.id === memberData.id);
      if (existingIndex !== -1) {
        dbMembers[existingIndex] = memberData; // Update existing
      } else {
        dbMembers.push(memberData); // Add new
      }
    }

    // Extracts highest integer ID from member records based on prefix ('M-' or 'E-')
    function getHighestIDNumber(memberList, prefix) {
      let maxNum = 0;
      memberList.forEach(member => {
        if (member.id && member.id.startsWith(prefix)) {
          const numPart = parseInt(member.id.replace(prefix, ''), 10);
          if (!isNaN(numPart) && numPart > maxNum) {
            maxNum = numPart;
          }
        }
      });
      return maxNum;
    }

    // Formats integer into padded ID string (e.g. 4 -> "M-004")
    function formatID(prefix, number) {
      return prefix + String(number).padStart(3, '0');
    }

    // --- EVENT LISTENERS ---

    // AUTO-GENERATE NEW ID
    btnNewId.addEventListener('click', async () => {
      const currentMembers = await getMembersFromDatabase();
      
      // Default to 'M-' prefix unless input starts with 'E-'
      const currentInput = txtMemberId.value.trim().toUpperCase();
      const prefix = currentInput.startsWith('E-') ? 'E-' : 'M-';

      const maxNum = getHighestIDNumber(currentMembers, prefix);
      const nextId = formatID(prefix, maxNum + 1);

      txtMemberId.value = nextId;
      txtMemberName.value = ''; // Clear name field for new entry
    });

    // SAVE MEMBER WITH SEQUENTIAL ID VALIDATION
    btnSaveMember.addEventListener('click', async () => {
      const typedId = txtMemberId.value.trim().toUpperCase();
      const name = txtMemberName.value.trim();

      if (!typedId || !name) {
        alert("Please enter both Member ID and Name.");
        return;
      }

      const currentMembers = await getMembersFromDatabase();
      const existingMember = currentMembers.find(m => m.id === typedId);

      // Validation logic for newly created IDs
      if (!existingMember) {
        const prefix = typedId.startsWith('E-') ? 'E-' : 'M-';
        const maxNum = getHighestIDNumber(currentMembers, prefix);
        const expectedNextId = formatID(prefix, maxNum + 1);

        if (typedId !== expectedNextId) {
          alert(`Invalid Sequence! You cannot skip IDs.\nThe next required ID is: ${expectedNextId}`);
          return; // Block save execution
        }
      }

      // Execute Save Action
      try {
        await saveMemberToDatabase({ id: typedId, name: name });
        alert(`Member ${typedId} saved successfully!`);
        
        // Reset form inputs after save
        txtMemberId.value = '';
        txtMemberName.value = '';
      } catch (error) {
        console.error("Error saving member:", error);
        alert("Failed to save member record.");
      }
    });
  </script>
</body>
</html>
