<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MAQALI FAMILY MEETING</title>
  <link rel="stylesheet" href="styles.css">

  <!-- Mobile Developer Console -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>

  <!-- Firebase Web SDK Imports -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="login-title">MAQALI FAMILY MEETING</div>
      <div class="login-subtitle">Sign in using Member ID (e.g. M-001) or Editor ID (E-001)</div>

      <form id="loginForm" onsubmit="return false;">
        <div class="field-row">
          <span class="field-label">Account ID</span>
          <input type="text" id="authLoginId" class="field-input" placeholder="e.g. M-001 or E-001" required autocomplete="username">
        </div>

        <div class="field-row">
          <span class="field-label">Password</span>
          <input type="password" id="authLoginPass" class="field-input" placeholder="Password" required autocomplete="current-password">
        </div>

        <button type="submit" class="action-btn save-btn" id="btnSubmitAuthLogin" style="width: 100%; margin-top: 10px;">Sign In</button>
      </form>

      <!-- FORGOT PASSWORD LINK -->
      <div style="text-align: center; margin-top: 15px;">
        <a href="#" id="btnForgotPass" style="color: #60a5fa; font-size: 0.85rem; text-decoration: underline;">
          Forgot Password? (Reset with Admin PIN)
        </a>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const loginForm = document.getElementById('loginForm');
      const forgotLink = document.getElementById('btnForgotPass');

      if (loginForm) {
        loginForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const rawId = document.getElementById('authLoginId').value.trim().toUpperCase();
          const pass = document.getElementById('authLoginPass').value.trim();

          if (!rawId || !pass) return alert("Please enter both Account ID and Password.");

          const cleanId = rawId.replace(/\s+/g, '');
          const targetEmail = `${cleanId.toLowerCase()}@maqali.app`;

          const submitBtn = document.getElementById('btnSubmitAuthLogin');
          submitBtn.disabled = true;
          submitBtn.innerText = "Signing in...";

          firebase.auth().signInWithEmailAndPassword(targetEmail, pass)
            .then(() => {
              window.location.href = "index.html";
            })
            .catch((error) => {
              submitBtn.disabled = false;
              submitBtn.innerText = "Sign In";
              alert("Authentication failed: " + error.message);
            });
        });
      }

      if (forgotLink) {
        forgotLink.addEventListener('click', (e) => {
          e.preventDefault();
          const memberId = prompt("Enter your Account ID (e.g., M-001):");
          if (!memberId) return;

          const pin = prompt("Enter the Admin Reset PIN:");
          if (!pin) return;

          firebase.database().ref('settings/adminResetPin').once('value')
            .then((snapshot) => {
              const masterPin = snapshot.val() || "1234";
              if (pin.trim() === masterPin.toString()) {
                alert(`PIN Verified for ${memberId.toUpperCase()}!\n\nPlease contact the Editor to re-issue your password.`);
              } else {
                alert("Invalid Admin Reset PIN. Access denied.");
              }
            })
            .catch((err) => {
              alert("Error verifying PIN: " + err.message);
            });
        });
      }
    });
  </script>
</body>
</html>
